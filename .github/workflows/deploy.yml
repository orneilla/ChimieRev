# Publie automatiquement l'application sur GitHub Pages.
# À chaque envoi de code sur la branche, GitHub reconstruit l'app
# et met l'adresse publique à jour. Aucun ordinateur n'est nécessaire.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, claude/chimierev-app-u8s889]
  # Permet aussi de relancer le déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Droits nécessaires pour publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages tout seul si ce n'est pas déjà fait,
          # au lieu d'échouer.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
